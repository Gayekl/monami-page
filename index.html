let page='home',cat='전체',selected=null,temp='ICE',shot=false,qty=1,cart=[],receipt=null,expanded=-1,prog=-1;const params=new URLSearchParams(location.search);let table=['01','02','03','04'].includes(params.get('table'))?params.get('table'):'01';let notes=[];try{notes=JSON.parse(localStorage.getItem('monamiNotes')||'[]')}catch(e){}const el=document.getElementById('view'),won=n=>'₩'+n.toLocaleString('ko-KR');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const image=(d,large=false)=>`<img class="${large?'photo-large':'photo'}" loading="lazy" alt="${esc(d.name)} 실사 스타일 시연용 사진" src="${d.img}" >`;function navTo(p){page=p;selected=null;render();scrollTo(0,0)}function pick(i){selected=i;temp='ICE';shot=false;qty=1;render();scrollTo(0,0)}function changeQty(delta){qty=Math.max(1,qty+delta);render()}function add(){const d=drinks[selected],key=selected+'-'+temp+'-'+shot,price=d.price+(shot?500:0);const old=cart.find(x=>x.key===key);if(old)old.qty+=qty;else cart.push({key,name:d.name,price,qty,temp,shot});navTo('cart')}function updateCart(i,delta){cart[i].qty=Math.max(1,cart[i].qty+delta);render()}function checkout(){if(!cart.length)return;receipt={items:cart.map(x=>({...x})),total:cart.reduce((s,x)=>s+x.price*x.qty,0),table,number:'MP-'+String(Date.now()).slice(-6)};cart=[];page='complete';render();scrollTo(0,0)}function saveNote(){const v=document.getElementById('note').value.trim();if(!v)return;notes.unshift({text:v,date:new Date().toLocaleDateString('ko-KR')});localStorage.setItem('monamiNotes',JSON.stringify(notes));render()}function deleteNote(i){notes.splice(i,1);localStorage.setItem('monamiNotes',JSON.stringify(notes));render()}function copyNote(i){navigator.clipboard?.writeText(notes[i].text).then(()=>alert('기록이 복사되었습니다.')).catch(()=>{})}function title(top,heading,sub=''){return `<div class="eyebrow">${top}</div><h2>${heading}</h2>${sub?`<p>${sub}</p>`:''}`}
function render(){document.getElementById('table').value=table;const cc=cart.reduce((s,x)=>s+x.qty,0),badge=document.getElementById('cartcount');badge.hidden=!cc;badge.textContent=cc;let s='';if(page==='home'){s=`<div class="eyebrow">MONAMI × BRAND CAFÉ</div><h1>MONAMI<br>PAGE</h1><p>선의 시작부터, 기록의 완성까지.</p><hr class="rule"><div class="eyebrow">01 / BRAND STORY</div><h2>기록의 가치를<br>공간의 경험으로</h2><p>모나미는 일상 속 생각과 감정을 기록하는 필기구 브랜드입니다. MONAMI PAGE는 이러한 기록의 가치를 카페 공간으로 확장한 협업 브랜드 카페입니다.</p><p>방문객은 커피를 즐기고, 펜을 체험하며 자신만의 이야기를 남깁니다. 단순한 소비를 넘어 새로운 기록이 만들어지는 공간을 제안합니다.</p><div class="card topspace"><div class="eyebrow">QR TABLE SERVICE</div><h2>TABLE ${table}</h2><p>자리에서 음료를 주문하고 공간 프로그램을 확인하세요.</p><button class="primary full" onclick="navTo('order')">메뉴 주문하기 →</button></div><div class="shortcuts"><button class="shortcut" onclick="navTo('space')">▦<strong>SPACE</strong><small>공간 알아보기 →</small></button><button class="shortcut" onclick="navTo('experience')">✎<strong>EXPERIENCE</strong><small>펜 체험하기 →</small></button></div>`}
if(page==='order'){if(selected===null){s=title('ORDER / TABLE '+table,'메뉴 주문','오늘의 페이지를 채울 음료를 선택하세요.')+`<div class="categories">${['전체','시그니처','커피','디카페인','논커피','티'].map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}</div>`+drinks.map((d,i)=>cat!=='전체'&&d.cat!==cat?'':`<button class="menuitem" onclick="pick(${i})">${image(d)}<div class="itemtext"><strong>${d.name}</strong><p>${d.desc}</p><div class="price">${won(d.price)}</div></div><span class="plus">＋</span></button>`).join('')+(cart.length?`<button class="primary full topspace" onclick="navTo('cart')">장바구니 확인 · ${won(cart.reduce((a,x)=>a+x.price*x.qty,0))}</button>`:'')+`<p class="smallnote">음료 이미지는 메뉴별 실사 스타일 시연용 사진이며 실제 판매 제품 사진은 아닙니다.</p>`}else{const d=drinks[selected];s=`<button class="back" onclick="selected=null;render()">← 메뉴 목록</button><div class="detail-photo">${image(d,true)}</div><div class="eyebrow">${d.cat}</div><h2>${d.name}</h2><p>${d.desc}</p><h3>${won(d.price)}</h3><hr class="rule"><div class="option"><h3>온도 선택</h3><div class="toggle">${['ICE','HOT'].map(t=>`<button class="${temp===t?'active':''}" onclick="temp='${t}';render()">${t}</button>`).join('')}</div></div><div class="option"><h3>추가 옵션</h3><div class="toggle"><button class="${!shot?'active':''}" onclick="shot=false;render()">기본</button><button class="${shot?'active':''}" onclick="shot=true;render()">샷 추가 +₩500</button></div></div><div class="qtyrow"><strong>수량</strong><div class="counter"><button onclick="changeQty(-1)">−</button>${qty}<button onclick="changeQty(1)">＋</button></div></div><button class="primary full" onclick="add()">장바구니 담기 · ${won((d.price+(shot?500:0))*qty)}</button>`}}
if(page==='space'){s=title('SPACE / MONAMI PAGE','공간 안내','모나미의 기록을 공간으로 경험하는 네 가지 프로그램')+spaces.map((x,i)=>`<button class="zone" onclick="expanded=expanded===${i}?-1:${i};render()"><div class="zonehead"><div class="num">0${i+1}</div><div style="flex:1"><strong>${x[0]}</strong><small>${x[1]}</small></div><span>${expanded===i?'⌃':'›'}</span></div>${expanded===i?`<p>${x[2]}</p>`:''}</button>`).join('')+`<button class="secondary full topspace" onclick="navTo('experience')">체험 프로그램 살펴보기 →</button>`}
if(page==='experience'){s=title('EXPERIENCE / PEN LAB','체험 프로그램','한 자루의 펜으로 시작되는 나만의 기록')+programs.map((x,i)=>`<button class="zone" onclick="prog=prog===${i}?-1:${i};render()"><div class="program"><div class="circle">0${i+1}</div><div style="flex:1"><strong>${x[0]}</strong><small>${x[1]}</small></div><span>${prog===i?'⌃':'›'}</span></div>${prog===i?`<p>${x[2]}</p>`:''}</button>`).join('')+`<div class="card"><div class="eyebrow">MY TRACE</div><h3 style="margin-top:12px">나만의 페이지를 완성하세요.</h3><p>오늘의 생각을 짧은 기록으로 남겨보세요.</p><button class="primary full" onclick="navTo('my')">기록 작성하기 →</button></div>`}
if(page==='my'){s=title('MY PAGE / MY TRACE','오늘의 페이지를<br>남겨보세요.','오늘의 감정과 생각을 자유롭게 기록하세요.')+`<textarea class="notearea" id="note" placeholder="오늘의 기록을 남겨보세요..."></textarea><button class="primary full" style="margin-top:12px" onclick="saveNote()">기록 카드 만들기</button><hr class="rule"><h3>나의 기록함 <small style="font-weight:400;color:#999">${notes.length}</small></h3>`+(notes.length?notes.map((n,i)=>`<div class="note"><div class="eyebrow">MONAMI PAGE · ${esc(n.date)}</div><p style="white-space:pre-wrap;color:#333">${esc(n.text)}</p><div class="noteactions"><button onclick="copyNote(${i})">복사</button><button onclick="deleteNote(${i})">삭제</button></div></div>`).join(''):`<div class="card" style="text-align:center;color:#999;font-size:13px">아직 작성한 기록이 없습니다.</div>`)}
if(page==='cart'){s=title('ORDER / TABLE '+table,'주문 내역','선택한 음료를 확인해 주세요.');if(!cart.length)s+=`<div class="card" style="text-align:center"><p>장바구니가 비어 있습니다.</p><button class="primary" onclick="navTo('order')">메뉴 둘러보기</button></div>`;else{s+=cart.map((x,i)=>`<div class="cartitem"><div class="carthead"><div><strong>${x.name}</strong><p style="font-size:12px">${x.temp} · ${x.shot?'샷 추가':'기본'}</p><strong>${won(x.price*x.qty)}</strong></div><button class="secondary" onclick="cart.splice(${i},1);render()">삭제</button></div><div class="cartcontrols"><button onclick="updateCart(${i},-1)">−</button>${x.qty}<button onclick="updateCart(${i},1)">＋</button></div></div>`).join('')+`<div class="receiptrow topspace"><strong>총 주문 금액</strong><strong>${won(cart.reduce((s,x)=>s+x.price*x.qty,0))}</strong></div><button class="primary full topspace" onclick="checkout()">주문하기</button><button class="secondary full" style="margin-top:9px" onclick="navTo('order')">메뉴 더 담기</button>`}}
if(page==='complete'&&receipt){const o=receipt;s=`<div class="success"><div class="check">✓</div><div class="eyebrow">MONAMI PAGE · ORDER COMPLETE</div><h2>주문이 완료되었습니다!</h2><p>MONAMI PAGE에서 즐거운 시간 보내세요.</p><div class="receipt"><div class="receiptrow"><span>테이블 번호</span><strong>TABLE ${o.table}</strong></div><div class="receiptrow"><span>주문 번호</span><strong>${o.number}</strong></div><hr><h3>주문 내역</h3>${o.items.map(x=>`<div class="receiptrow"><span>${x.name}<br><small>${x.temp} · ${x.qty}개</small></span><strong>${won(x.price*x.qty)}</strong></div>`).join('')}<hr><div class="receiptrow"><strong>총 주문 금액</strong><strong>${won(o.total)}</strong></div></div><button class="primary full" onclick="navTo('home')">홈으로 돌아가기</button><button class="secondary full" style="margin-top:9px" onclick="navTo('order')">메뉴 더 둘러보기</button><div class="smallnote">전시용 프로토타입으로 실제 주문 및 결제는 진행되지 않습니다.</div></div>`}
el.innerHTML=s;document.getElementById('nav').innerHTML=[['home','⌂','HOME'],['order','<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V7Z"/><path d="M17 9h2a3 3 0 0 1 0 6h-2"/><path d="M3 21h17"/></svg>','ORDER'],['space','▦','SPACE'],['experience','✎','EXPERIENCE'],['my','♙','MY PAGE']].map(([p,ico,name])=>`<button class="${page===p?'active':''}" onclick="navTo('${p}')"><span class="navicon">${ico}</span><span>${name}</span></button>`).join('')}
document.getElementById('table').addEventListener('change',e=>{table=e.target.value;render()});document.getElementById('bag').addEventListener('click',()=>navTo('cart'));render();
</script></body></html>
